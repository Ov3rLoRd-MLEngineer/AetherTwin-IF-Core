<?xml version="1.0" encoding="UTF-8"?>
<!-- AetherTwin (I&F Core) — Inoue & Fuma enlacés en Yin & Yang.
     Inoue : moitié claire, taches rousse et noire (calico). Fuma : moitié sombre, rayures argentées (black smoke tigré).
     Formes géométriques simples : le fichier peut être remplacé par un dessin définitif. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="t">
  <title id="t">AetherTwin I&amp;F Core — Inoue et Fuma</title>
  <defs>
    <clipPath id="fuma">
      <path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2 Z"/>
    </clipPath>
    <clipPath id="disc"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>

  <!-- Inoue : fond clair et taches calico -->
  <circle cx="50" cy="50" r="48" fill="#f6f1e7"/>
  <g clip-path="url(#disc)">
    <circle cx="24" cy="38" r="11" fill="#e08a3c"/>
    <circle cx="33" cy="16" r="6.5" fill="#2b2b2f"/>
    <circle cx="16" cy="60" r="5" fill="#2b2b2f"/>
  </g>

  <!-- Fuma : moitié sombre et rayures argentées -->
  <path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2 Z" fill="#33363d"/>
  <g clip-path="url(#fuma)" fill="none" stroke="#9aa0a8" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <path d="M70 20 Q82 34 80 50"/>
    <path d="M79 58 Q78 72 68 82"/>
    <path d="M60 86 Q50 92 40 88"/>
  </g>

  <!-- Chacun porte un peu de l'autre -->
  <circle cx="50" cy="26" r="7" fill="#33363d"/>
  <circle cx="50" cy="74" r="7" fill="#f6f1e7"/>

  <circle cx="50" cy="50" r="48" fill="none" stroke="#e8c268" stroke-width="2.5"/>
</svg>
