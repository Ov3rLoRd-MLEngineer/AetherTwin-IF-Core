<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Téléviseur — Atelier circuits Æther</title>
  <link rel="icon" href="/static/logo.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/logo-256.png">
  <link rel="stylesheet" href="/static/crt.css">
  <script src="/static/nes_ppu.js" defer></script>
  <script src="/static/crt.js" defer></script>
  <script src="/static/crt_tv.js" defer></script>
</head>
<body>
  <div class="cabinet">
    <div class="glass"><canvas id="screen" width="1024" height="768"></canvas></div>
    <div class="panel">
      <span class="brand">ÆTHER</span>
      <span class="model">COLOR TV · 14"</span>
      <span class="grow"></span>
      <label title="Bombé du verre">Verre <input type="range" id="curve" min="0" max="0.3" step="0.01" value="0.12"></label>
      <label title="Lignes de balayage et masque">Lignes <input type="range" id="scan" min="0" max="1" step="0.05" value="0.7"></label>
      <label title="Halo du phosphore">Halo <input type="range" id="glow" min="0" max="1.5" step="0.05" value="0.8"></label>
      <button type="button" id="full" title="Plein écran (F11)">⛶</button>
      <span id="led" class="led" title="Témoin d'alimentation de la console"></span>
      <button type="button" id="power" class="knob" title="Interrupteur de la console">⏻</button>
    </div>
  </div>
  <p id="orphan" class="orphan" hidden>L'atelier qui alimentait ce téléviseur est fermé.</p>
</body>
</html>
