    models:                          # ollama show, le 16/11/2026
      - { name: "qwen3-27b:latest", parameters: "27.3B", quantization: "Q4_K_M", context_length: 262144, disk_gb: 16 }
      - { name: "qwen3-35b:latest", parameters: "34.7B", quantization: "Q4_K_M", context_length: 262144, disk_gb: 21 }
      - { name: "qwen3-coder:30b-a3b-q4_K_M", parameters: "30.5B", quantization: "Q4_K_M", context_length: 262144, disk_gb: 18 }
