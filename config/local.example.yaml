# Copie ce fichier en config/local.yaml (ignoré par Git) et adapte-le.
# Aucune clé API ici : les secrets passent par des variables d'environnement.

ollama:
  # Hôte:port de l'API Ollama. Local, ou une autre machine du réseau local.
  host: "127.0.0.1:11434"
  # Modèle utilisé quand une demande n'en précise pas. Tant que la machine a 32 Go de VRAM,
  # on reste en Q4_K_M : mesures dans config/hardware_profiles.yaml.
  default_model: "qwen3-27b:latest"
  model_economy: "qwen3-coder:30b-a3b-q4_K_M"
  model_quality: ""        # profil Q8_0 : non défini (trop lourd pour 32 Go)
  big_model_gb: 8          # au-dessus : « gros modèle », un seul chargé à la fois
  num_ctx: 32768
  keep_alive: "5m"

strata:
  # Moteur secondaire optionnel pour les gros modèles « mélange d'experts » (MoE) : https://github.com/Niko1221/Strata
  # Ollama reste le moteur principal (vision, embeddings, modèles denses). Désactivé : le Hub l'ignore.
  # Ses modèles apparaissent dans le Hub sous le nom strata/<id> ; Strata arrêté = repli sur Ollama.
  enabled: false
  host: "127.0.0.1:8090"   # 8080 est souvent pris par Open WebUI ; garder 127.0.0.1 (--access local)
  model: ""                # id servi par Strata ; vide = le premier de /v1/models
  launcher: ""             # chemin de strata.cmd (ex. <dossier Strata>\terminal\current\bin\strata.cmd)
  data_dir: ""             # STRATA_DATA_DIR de l'installation, si elle n'est pas à l'endroit par défaut
  preset: ""               # préréglage enregistré par `strata launch --save-preset` (modèle, contexte, cartes, port)
  key_env: ""              # nom d'une variable d'environnement si Strata demande une clé ; jamais la clé ici
  fallback_to_ollama: true
  vram_gb: 0               # place annoncée à Inoue quand Strata tourne ; 0 = la mesure des cartes suffit
  timeout_s: 600

router:
  # Routeur local (OmniRoute) : expose Ollama au format attendu par Claude Code.
  # Garde-le en écoute sur 127.0.0.1 (OMNIROUTE_SERVER_HOST=127.0.0.1).
  url: "http://127.0.0.1:20128/v1"

hardware:
  profile: "auto"          # "auto" = topologie mesurée au lancement
  vram_safety_margin: 0.10 # 10 % de la VRAM totale, jamais consommés

daemon:
  bind: "127.0.0.1"        # ne jamais écouter ailleurs
  port: 5750

gaming_hud:
  adapter: "wow_retail"    # wow_retail | log_tail | screen_ocr
  game_path: ""            # dossier _retail_ ; vide = détection automatique
  rules_file: ""           # log_tail : chemin d'un fichier de règles YAML
  poll_seconds: 2
  showcase_processes: ["obs64.exe", "obs32.exe", "obs.exe"]   # leur présence active le mode Showcase
  hide_character_names: false                                  # en Showcase : remplace les noms de personnages
  gold: "round"            # en Showcase : round (arrondi) | hide (masqué) | keep
  obs_hud_port: 5757

knowledge:
  db: "data/knowledge.sqlite"              # base vectorielle locale (ignorée par Git)
  embed_model: "nomic-embed-text"          # à installer : ollama pull nomic-embed-text ; vide = recherche par mots
  sources_file: "config/knowledge_sources.yaml"
  min_delay_s: 5                           # délai entre deux requêtes vers un même site
  nightly: true                            # Fuma relance l'ingestion chaque nuit (23 h → 7 h)

genesis_lab:
  profile: "data/genesis_lab/eleve.json"   # progression de l'élève (ignorée par Git)
  hub_api: "http://127.0.0.1:5750"          # explications rédigées par le modèle local, via le Hub ; vide = types
  model: ""                                 # vide = modèle par défaut du Hub

mangastudio:
  handsegnet_weights: ""   # chemin local des poids (non versionnés)
  footsegnet_weights: ""
