name: tests

on:
  push:
    branches: [main, concours]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Le projet vise Windows (WebView2, pywinpty, Piper, chemins) ; Ubuntu : 10 tests propres à Windows,
        # portage en cours (voir PROJECT_STATUS.md).
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: "Tests (mode dégradé : sans GPU, sans jeu, sans OBS, sans réseau externe)"
        run: python -m pytest
