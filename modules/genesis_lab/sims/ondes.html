<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Ondes</title>
<style>
body{margin:0;background:#0b132b;color:#e0e6f5;font:14px system-ui,sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:8px 12px;background:#1c2541}
label{display:flex;gap:6px;align-items:center}canvas{display:block;width:100%}
#info{padding:6px 12px;color:#a8b3cf;min-height:44px}b{color:#ffd166}
</style></head><body>
<div id="bar">
<label>Fréquence <input id="f" type="range" min="0.2" max="3" step="0.1" value="1"> <span id="fv"></span></label>
<label>Amplitude <input id="A" type="range" min="10" max="120" value="60"></label>
<label>Célérité <input id="v" type="range" min="50" max="400" value="200"> px/s</label>
<label>Mode <select id="m"><option value="prog">onde progressive</option><option value="inter">interférences (2 sources)</option><option value="doppler">effet Doppler</option></select></label>
</div>
<canvas id="c" width="900" height="440"></canvas>
<div id="info"></div>
<script>
const c=document.getElementById("c"),g=c.getContext("2d"),$=id=>document.getElementById(id);let t=0,last=performance.now(),src=150;
function prog(){const f=+$("f").value,A=+$("A").value,v=+$("v").value,lam=v/f;
 g.strokeStyle="#5bc0eb";g.lineWidth=3;g.beginPath();for(let x=0;x<=c.width;x+=3){const y=220+A*Math.sin(2*Math.PI*(f*t-x/lam));x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
 g.fillStyle="#ffd166";const xm=300,ym=220+A*Math.sin(2*Math.PI*(f*t-xm/lam));g.beginPath();g.arc(xm,ym,8,0,7);g.fill();
 g.strokeStyle="#fde68a";g.beginPath();g.moveTo(100,400);g.lineTo(100+lam,400);g.stroke();g.fillStyle="#fde68a";g.fillText(`λ = ${lam.toFixed(0)} px`,100,420);
 $("info").innerHTML=`Le point jaune monte et descend sur place : l'onde transporte de l'<b>énergie</b>, pas de matière. Longueur d'onde <b>λ = v / f</b> = ${v} / ${f} = ${lam.toFixed(0)} px. Période T = 1/f = ${(1/f).toFixed(2)} s.`}
function inter(){const f=+$("f").value,v=+$("v").value,lam=v/f,d=+$("A").value*2;const img=g.createImageData(c.width/3,c.height/3);
 const s1=[c.width/2-d/2,60],s2=[c.width/2+d/2,60];
 for(let j=0;j<img.height;j++)for(let i=0;i<img.width;i++){const x=i*3,y=j*3,r1=Math.hypot(x-s1[0],y-s1[1]),r2=Math.hypot(x-s2[0],y-s2[1]);
  const a=Math.sin(2*Math.PI*(f*t-r1/lam))+Math.sin(2*Math.PI*(f*t-r2/lam));const k=(j*img.width+i)*4,b=Math.round(127+63*a);img.data[k]=b*0.4;img.data[k+1]=b*0.8;img.data[k+2]=b;img.data[k+3]=255}
 const tmp=document.createElement("canvas");tmp.width=img.width;tmp.height=img.height;tmp.getContext("2d").putImageData(img,0,0);g.imageSmoothingEnabled=true;g.drawImage(tmp,0,0,c.width,c.height);
 g.fillStyle="#ffd166";[s1,s2].forEach(s=>{g.beginPath();g.arc(s[0],s[1],6,0,7);g.fill()});
 $("info").innerHTML=`Deux sources identiques : là où les ondes arrivent <b>en phase</b>, elles s'ajoutent (zones claires et sombres très contrastées) ; <b>en opposition de phase</b>, elles s'annulent (zones grises). Écartez les sources (curseur Amplitude) ou changez la fréquence pour voir les franges bouger.`}
function doppler(){const f=+$("f").value,v=+$("v").value,vs=v*0.5;src+=vs/60;if(src>c.width+50)src=-50;
 for(let k=0;k<14;k++){const age=(t*f-Math.floor(t*f))/f+k/f,emitted=src-vs*age,r=v*age;g.strokeStyle=`rgba(91,192,235,${1-k/14})`;g.beginPath();g.arc(emitted,220,r,0,7);g.stroke()}
 g.fillStyle="#ffd166";g.beginPath();g.arc(src,220,10,0,7);g.fill();
 const fa=f*v/(v-vs),fb=f*v/(v+vs);g.fillStyle="#e0e6f5";g.fillText(`devant : ${fa.toFixed(2)} Hz (plus aigu)`,700,40);g.fillText(`derrière : ${fb.toFixed(2)} Hz (plus grave)`,40,40);
 $("info").innerHTML=`<b>Effet Doppler</b> : la source avance à la moitié de la célérité. Devant elle, les fronts d'onde se resserrent : la fréquence perçue augmente (son plus aigu, comme une sirène qui approche) ; derrière, elle diminue.`}
function loop(now){t+=(now-last)/1000;last=now;$("fv").textContent=$("f").value+" Hz";g.fillStyle="#0b132b";g.fillRect(0,0,c.width,c.height);
 ({prog,inter,doppler})[$("m").value]();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
