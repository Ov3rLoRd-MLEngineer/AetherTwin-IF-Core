<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Système solaire</title>
<style>
body{margin:0;background:#0b1020;color:#e8ecf5;font:14px system-ui,sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 12px;background:#141b33}
label{display:flex;gap:6px;align-items:center}canvas{display:block;width:100%;cursor:grab;touch-action:none}canvas.drag{cursor:grabbing}
#info{padding:6px 12px;color:#aab3cc;min-height:40px}
</style></head><body>
<div id="bar">
<label>Vitesse <input id="speed" type="range" min="1" max="200" value="40"></label>
<label><input id="real" type="checkbox"> distances réelles (échelle)</label>
<label><input id="trail" type="checkbox" checked> traces</label>
<button id="home">Vue d'ensemble</button>
</div>
<canvas id="c" width="900" height="560"></canvas>
<div id="help" style="padding:4px 12px 0;color:#8a93ad;font-size:12.5px">Molette : zoomer vers le pointeur · glisser : se déplacer · clic : informations · double-clic : suivre la planète · Échap : vue d'ensemble.</div>
<div id="info">Cliquez sur une planète. Plus une planète est loin du Soleil, plus elle tourne lentement (3e loi de Kepler : T² ∝ a³).</div>
<script>
const P=[["Mercure",0.387,0.241,"#b5b5b5",3,"Planète la plus proche du Soleil, sans atmosphère notable."],
["Vénus",0.723,0.615,"#e3c16f",5,"Atmosphère épaisse de CO₂ : la plus chaude des planètes (≈ 460 °C)."],
["Terre",1,1,"#4f8ff7",5,"La seule planète connue abritant la vie ; 1 an = 365,25 jours."],
["Mars",1.524,1.881,"#d9623b",4,"La planète rouge : oxyde de fer en surface, deux petites lunes."],
["Jupiter",5.203,11.86,"#d8a774",10,"Géante gazeuse, la plus grosse planète : 318 masses terrestres."],
["Saturne",9.537,29.46,"#e7d08c",9,"Géante gazeuse aux anneaux de glace et de roche."],
["Uranus",19.19,84.01,"#9fe3e8",7,"Géante de glace qui tourne « couchée » sur le côté."],
["Neptune",30.07,164.8,"#4b6cf0",7,"La plus lointaine : des vents à plus de 2 000 km/h."]];
const c=document.getElementById("c"),g=c.getContext("2d"),$=id=>document.getElementById(id);
let t=0,sel=2,zoom=1,vx=0,vy=0,follow=-1,moved=true,drag=null;
const world=[],pos=[];
// rayon de l'orbite « sur la carte » (avant zoom) : échelle réelle, ou comprimée pour tout voir
function radius(a){const w=Math.min(c.width,c.height)/2-24;return $("real").checked?a/30.07*w:28+Math.sqrt(a)*w/5.6}
function toScreen(x,y){return[c.width/2+(x-vx)*zoom,c.height/2+(y-vy)*zoom]}
function canvasXY(e){const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]}
function draw(){
 if(!$("trail").checked||moved){g.fillStyle="#0b1020";g.fillRect(0,0,c.width,c.height)}
 else{g.fillStyle="rgba(11,16,32,0.18)";g.fillRect(0,0,c.width,c.height)}
 moved=false;
 P.forEach((p,i)=>{const r=radius(p[1]),ang=2*Math.PI*t/p[2];world[i]=[r*Math.cos(ang),-r*Math.sin(ang)]});
 if(follow>=0){vx=world[follow][0];vy=world[follow][1];moved=$("trail").checked?moved:moved}
 const grow=Math.min(4,Math.max(1,Math.pow(zoom,0.35)));
 const[sx,sy]=toScreen(0,0);g.fillStyle="#ffd34d";g.shadowColor="#ffb703";g.shadowBlur=18;g.beginPath();g.arc(sx,sy,14*grow,0,7);g.fill();g.shadowBlur=0;
 let hidden=0;
 P.forEach((p,i)=>{const r=radius(p[1])*zoom;
  g.strokeStyle="rgba(255,255,255,0.08)";g.lineWidth=1;g.beginPath();g.arc(sx,sy,r,0,7);g.stroke();
  const[x,y]=toScreen(world[i][0],world[i][1]);pos[i]=[x,y];
  const pr=p[4]*grow;
  if(x<-pr||y<-pr||x>c.width+pr||y>c.height+pr){hidden++;return}
  g.fillStyle=p[3];g.beginPath();g.arc(x,y,pr,0,7);g.fill();
  if(i===5){g.strokeStyle="rgba(231,208,140,.7)";g.lineWidth=2;g.beginPath();g.ellipse(x,y,pr*1.9,pr*0.6,-0.3,0,7);g.stroke()}
  if(i===sel){g.strokeStyle="#fff";g.lineWidth=1;g.beginPath();g.arc(x,y,pr+4,0,7);g.stroke()}
  g.fillStyle="#cfd6ea";g.font="12px system-ui";g.fillText(p[0],x+pr+3,y-pr-2)});
 g.fillStyle="#e8ecf5";g.font="13px system-ui";g.fillText(`Temps écoulé : ${t.toFixed(2)} années terrestres`,12,20);
 g.fillStyle="#8a93ad";g.fillText(`zoom ×${zoom<10?zoom.toFixed(1):Math.round(zoom)}${follow>=0?` · suit ${P[follow][0]}`:""}${hidden?` · ${hidden} planète(s) hors du champ`:""}`,12,38);
 if($("real").checked){const ua=radius(1)*zoom;let n=1;while(ua*n<40)n*=10;while(ua*n>200&&n>0.01)n/=10;
  g.strokeStyle="#cfd6ea";g.beginPath();g.moveTo(12,c.height-16);g.lineTo(12+ua*n,c.height-16);g.stroke();g.fillText(`${n} UA`,16,c.height-22)}
}
function info(){const p=P[sel];$("info").textContent=`${p[0]} : distance moyenne ${p[1]} UA, une révolution en ${p[2]} an(s) terrestre(s). ${p[5]} Vérification Kepler : T²/a³ = ${(p[2]**2/p[1]**3).toFixed(3)} (≈ 1 pour toutes).`}
function nearest(x,y){let best=-1,d=1e9;pos.forEach((q,i)=>{const k=Math.hypot(q[0]-x,q[1]-y);if(k<d){d=k;best=i}});return d<30?best:-1}
c.addEventListener("wheel",e=>{e.preventDefault();const[mx,my]=canvasXY(e),f=Math.exp(-e.deltaY*0.0015);
 const nz=Math.max(0.5,Math.min(600,zoom*f));
 if(follow<0){const wx=vx+(mx-c.width/2)/zoom,wy=vy+(my-c.height/2)/zoom;vx=wx-(mx-c.width/2)/nz;vy=wy-(my-c.height/2)/nz}
 zoom=nz;moved=true},{passive:false});
c.addEventListener("pointerdown",e=>{const[x,y]=canvasXY(e);drag={x,y,sx:x,sy:y};c.setPointerCapture(e.pointerId);c.classList.add("drag")});
c.addEventListener("pointermove",e=>{if(!drag)return;const[x,y]=canvasXY(e);if(Math.hypot(x-drag.sx,y-drag.sy)>4){follow=-1;vx-=(x-drag.x)/zoom;vy-=(y-drag.y)/zoom;moved=true}drag.x=x;drag.y=y});
c.addEventListener("pointerup",e=>{c.classList.remove("drag");if(drag&&Math.hypot(drag.x-drag.sx,drag.y-drag.sy)<=4){const i=nearest(drag.x,drag.y);if(i>=0){sel=i;info()}}drag=null});
c.addEventListener("dblclick",e=>{const[x,y]=canvasXY(e),i=nearest(x,y);if(i<0)return;sel=i;follow=i;info();
 const want=Math.min(c.width,c.height)*0.12/Math.max(8,radius(P[i][1])*0.15);zoom=Math.max(zoom,Math.min(600,Math.max(4,want*10)));moved=true});
function home(){zoom=1;vx=vy=0;follow=-1;moved=true}
$("home").onclick=home;addEventListener("keydown",e=>{if(e.key==="Escape")home()});
$("real").addEventListener("change",()=>{moved=true});
function loop(){t+=$("speed").value/6000;draw();requestAnimationFrame(loop)}
info();loop();
</script></body></html>
