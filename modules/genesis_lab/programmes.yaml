# Programmes annuels du Professeur, du CP à la terminale.
# Découpage en chapitres proposé d'après les programmes officiels de l'Éducation nationale (cycles 2 et 3 de 2015
# mis à jour en 2018-2020, nouveaux programmes de français et de mathématiques du CP à la 6e de 2024-2025,
# cycle 4 de 2015 mis à jour en 2020, réforme du lycée de 2019). Ce n'est pas le texte officiel : l'ordre et le
# regroupement sont un choix d'enseignant, à vérifier sur le Bulletin officiel (bouton « Faire vérifier »).
# Chaque chapitre : « Titre : notions ». Les chapitres sont répartis sur l'année (3 trimestres) par curriculum.py.

source: "Programmes officiels de l'Éducation nationale (Bulletin officiel, eduscol), découpage proposé, à vérifier"

matieres:
  francais: "Français"
  maths: "Mathématiques"
  monde: "Questionner le monde"
  sciences: "Sciences et technologie"
  histoire_geo: "Histoire-géographie et EMC"
  svt: "Sciences de la vie et de la Terre"
  physique_chimie: "Physique-chimie"
  technologie: "Technologie"
  anglais: "Anglais"
  ses: "Sciences économiques et sociales"
  snt: "Sciences numériques et technologie"
  nsi: "Numérique et sciences informatiques"
  philosophie: "Philosophie"
  ens_scientifique: "Enseignement scientifique"

niveaux:
  - id: cp
    nom: "CP"
    cycle: "Cycle 2 (avant le collège)"
    age: 6
