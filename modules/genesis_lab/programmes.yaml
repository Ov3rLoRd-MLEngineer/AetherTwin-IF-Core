        - "Le corps humain : les parties du corps, les cinq sens"
        - "Hygiène et santé : se laver, dormir, manger varié"
        - "La matière : solide et liquide, l'eau sous ses états"
        - "Le temps qui passe : calendrier, saisons, avant et après"
        - "L'espace proche : l'école, le quartier, un plan simple"
