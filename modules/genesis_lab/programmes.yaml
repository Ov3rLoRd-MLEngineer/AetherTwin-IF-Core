        - "Les nombres jusqu'à 100 : dizaines et unités, file numérique"
        - "Additionner : sens de l'addition, calcul mental, compléments à 10"
        - "Soustraire : retirer, chercher l'écart"
        - "Résoudre des problèmes : situations additives et soustractives"
        - "Doubles et moitiés, premiers partages"
        - "Se repérer dans l'espace : devant, derrière, gauche, droite, quadrillage"
        - "Les formes : carré, rectangle, triangle, cercle"
        - "Mesurer des longueurs : comparer, règle graduée, le centimètre"
