        - "Lire des syllabes et des mots : combinatoire, mots outils fréquents"
        - "Lire et comprendre une phrase : majuscule, point, sens de la phrase"
        - "Écrire en cursive : tenue du crayon, lettres, copie de mots"
        - "Écrire une phrase : encodage, dictée de syllabes et de mots"
        - "Le nom et le déterminant : un, une, le, la, les"
        - "Le singulier et le pluriel : le s du pluriel"
        - "Comprendre une histoire lue : personnages, lieux, ordre des événements"
        - "Dire et écouter : raconter, réciter une comptine ou un poème"
      maths:
